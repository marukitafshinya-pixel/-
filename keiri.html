  if(!d || !Array.isArray(d.slips) || !d.accounts){ alert('経理データのファイルではありません'); return false; }
  const when = d.savedAt ? new Date(d.savedAt).toLocaleString('ja-JP') : '不明';
  if(!confirm(`「${name}」を開きます（最終保存：${when}、仕訳 ${d.slips.length}件）。\nこの端末の今のデータは置き換わります。よろしいですか？`)) return false;
  S = migrate(d); persist(); draft = newDraft(); MFP = null; toast('データを読み込みました'); return true;
}
async function openFile(){
  if('showOpenFilePicker' in window){
    try{
      const [h] = await window.showOpenFilePicker({types:[{description:'経理データ', accept:{'application/json':['.json']}}]});
      const f = await h.getFile(); if(applyData(await f.text(), f.name)){ fileHandle = h; updateFileState(); go(current); }
    }catch(e){ if(e.name!=='AbortError') alert('開けませんでした：'+e.message); }
  } else { $('#fallbackFile').click(); }
}
function renderData(){
  V().innerHTML = `<h2>データファイル</h2><p class="lead">共有フォルダのデータファイルに保存すると、ほかの人もそのファイルを開いて同じデータを使えます。</p>
  <section class="box">
    <p>現在：<strong>${fileHandle?esc(fileHandle.name)+' に接続中':'データファイル未接続'}</strong>　仕訳 ${S.slips.length}件／業者 ${S.vendors.length}社／品目 ${S.items.length}件</p>
    <p style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="primary" id="d-open">データファイルを開く</button>
      <button id="d-save">${fileHandle?'上書き保存':'データファイルに保存'}</button>
      ${canFS?'<button id="d-saveas">別の名前で保存</button>':''}
    </p>
    <input type="file" id="fallbackFile" accept=".json,application/json" hidden>
    <div class="warnbox">複数人で使うときは、作業を始める前に共有フォルダのデータファイルを開き、終わったら上書き保存してください。2人が同時に入力して保存すると、後から保存した方の内容だけが残ります。</div>
    ${canFS?'':'<p class="note">このブラウザではファイルへの直接保存ができないため、保存するとダウンロードされます。Microsoft Edge または Google Chrome で開くと、共有フォルダのファイルに直接上書きできます。</p>'}
    <p style="margin-top:14px"><button id="d-viewer">閲覧用のファイルを書き出す（仕入単価の検索）</button></p>
    <p class="note">書き出した「仕入単価の検索（閲覧用）.html」をアプリと同じフォルダに置くと、ほかの人はそれを開くだけで、単価の検索だけを見られます（数字を直したり保存したりはできません）。開いたら「データファイルを開く」で共有フォルダの経理データファイルを選んでもらいます。</p>
    <p class="note">入力した内容は、この端末のブラウザにも自動で保存されています（同じパソコン・同じブラウザなら、閉じても次回残っています）。</p>
  </section>
  <section class="box">
    <h3 style="margin-top:0">PDF読み取りの設定</h3>
    <p class="note">納品書のPDF・写真をAIで読み取るための設定です。AnthropicのAPIキーを入れてください。キーはこのパソコンのブラウザにだけ保存され、データファイルには含まれません（パソコンごとに入れてください）。読み取るときだけ、そのPDFがAnthropicに送られます。</p>
    <div class="row">
      <label style="flex:2 1 320px">APIキー<input type="password" id="ai-key" value="${esc(aiKey())}" placeholder="sk-ant-…" autocomplete="off"></label>
      <label style="flex:1 1 200px">モデル<input id="ai-model" value="${esc(aiModel())}"></label>
      <button class="primary" id="ai-save">保存</button>
    </div>
    <p class="note">${aiKey()?'<span class="ok">APIキーは設定済みです。</span>':'<span class="ng">APIキーはまだ設定されていません。</span>'}</p>
  </section>
  <section class="box">
    <h3 style="margin-top:0">初期化</h3>
    <p class="note">この端末のデータをすべて消します。データファイルは消えません。</p>
    <button class="danger" id="d-clear">この端末のデータを消す</button>
  </section>`;
  $('#d-open').onclick = openFile;
  $('#d-viewer').onclick = makeViewLauncher;
  $('#ai-save').onclick = () => { try{ localStorage.setItem(AIK, $('#ai-key').value.trim()); localStorage.setItem(AIM, $('#ai-model').value.trim()||'claude-sonnet-5-5'); toast('保存しました'); renderData(); }catch(e){ alert('保存できませんでした'); } };
  $('#d-save').onclick = () => saveToFile(false);
  if($('#d-saveas')) $('#d-saveas').onclick = () => saveToFile(true);
  $('#fallbackFile').onchange = async e => { const f=e.target.files[0]; if(f && applyData(await f.text(), f.name)) renderData(); e.target.value=''; };
  $('#d-clear').onclick = () => { if(confirm('この端末のデータをすべて消しますか？（元に戻せません）')){ S = defaults(); persist(); draft=newDraft(); MFP=null; fileHandle=null; updateFileState(); renderData(); toast('消去しました'); } };
}
$('#quickSave').onclick = () => saveToFile(false);
$('#helpHere').onclick = () => { const sec = HELP.find(x=>x.view===current); HP.q=''; HP.focus = sec ? sec.id : null; go('help'); };

/* 科目のプルダウンを、打って探せる入力欄にする */
const TYPEABLE = 'select[data-f="account"],select[data-f="sub"],#f-credit,#f-csub,#v-credit,#v-csub,#v-account,#i-account,#i-sub,#bs-accs,#bs-accm,select[data-map],#l-credit,#l-account,#s-credit,#r-credit';
let TA_SEQ = 0;
function taKind(sel){
  if(sel.matches('select[data-map],#l-credit,#l-account,#s-credit,#r-credit')) return 'fixed';
  if(sel.matches('#f-credit,#v-credit')) return 'credit';
  if(sel.matches('select[data-f="sub"],#f-csub,#v-csub,#i-sub')) return 'sub';
  return 'debit';
}
function taSubParent(sel){
  if(sel.id==='f-csub') return draft.credit;
  if(sel.id==='v-csub'){ const c=$('#v-credit'); return c?c.value:''; }
  if(sel.id==='i-sub'){ const c=$('#i-account'); return c?c.value:''; }
  if(sel.dataset.f==='sub'){ const l = draft.lines[+sel.dataset.i]; return l ? l.account : ''; }
  return '';
}
function enhanceSelects(root){
  (root||document).querySelectorAll(TYPEABLE).forEach(sel=>{
    if(sel.dataset.ta) return; sel.dataset.ta = '1';
    const kind = taKind(sel);
    const id = 'ta-dl-'+(++TA_SEQ);
    const blank = [...sel.options].find(o=>o.value==='');
    const dl = document.createElement('datalist'); dl.id = id; dl.innerHTML = [...sel.options].filter(o=>o.value!=='').map(o=>`<option value="${esc(o.text)}">`).join('');
    const wrap = document.createElement('span'); wrap.className = 'ta-wrap';
    const inp = document.createElement('input'); inp.setAttribute('list', id); inp.className = 'ta-input'; inp.autocomplete = 'off';
    inp.placeholder = blank ? blank.text : '打って探せます'; inp.value = sel.selectedIndex>=0 && sel.value!=='' ? sel.options[sel.selectedIndex].text : '';
    inp.setAttribute('aria-label', sel.getAttribute('aria-label') || '科目'); inp.title = '科目名の一部を打つと候補が出ます。▼で一覧から選べます';
    const btn = document.createElement('button'); btn.type='button'; btn.className='ta-btn'; btn.textContent='▼'; btn.title='一覧から選ぶ'; btn.setAttribute('aria-label','一覧から選ぶ');
    if(sel.style.width) wrap.style.width = sel.style.width;
    sel.style.display = 'none'; sel.after(wrap, dl); wrap.append(inp, btn);
    const showText = () => { inp.value = sel.value!=='' && sel.selectedIndex>=0 ? sel.options[sel.selectedIndex].text : ''; };
    const addOption = (text) => { const o = new Option(text, text); sel.add(o); dl.insertAdjacentHTML('beforeend', `<option value="${esc(text)}">`); return o; };
    const commit = () => { const v = toHira(inp.value); const opts = [...sel.options].filter(x=>x.value!=='');
      if(v===''){ if(blank && sel.value!==''){ sel.value=''; sel.dispatchEvent(new Event('change',{bubbles:true})); } return; }
      let o = opts.find(x=>toHira(x.text)===v);
      if(!o){ const cand = opts.filter(x=>toHira(x.text).includes(v)); cand.sort((a,b)=>(toHira(b.text).startsWith(v)-toHira(a.text).startsWith(v)) || a.text.length-b.text.length); o = cand[0]; }
      if(!o){ toast('当てはまる科目がありません。▼で一覧から選んでください'); showText(); return; }
      inp.value = o.text; if(sel.value!==o.value){ sel.value = o.value; sel.dispatchEvent(new Event('change',{bubbles:true})); } };
    inp.addEventListener('change', commit);
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.isComposing){ e.preventDefault(); commit(); } });
    btn.addEventListener('click', () => {
      sel.style.display=''; wrap.style.display='none'; sel.size = Math.min(10, Math.max(4, sel.options.length)); sel.classList.add('ta-open'); sel.focus();
      const close = () => { sel.size = 0; sel.classList.remove('ta-open'); sel.style.display='none'; wrap.style.display=''; showText(); sel.removeEventListener('blur', close); sel.removeEventListener('change', onPick); sel.removeEventListener('keydown', onKey); };
      const onPick = () => setTimeout(close, 0);
      const onKey = e => { if(e.key==='Escape' || e.key==='Enter'){ e.preventDefault(); close(); } };
      sel.addEventListener('change', onPick); sel.addEventListener('blur', close); sel.addEventListener('keydown', onKey);
    });
  });
}
new MutationObserver(()=>enhanceSelects(document.getElementById('view'))).observe(document.getElementById('view'), {childList:true, subtree:true});
setupViewMode();
if(!VIEW_MODE){ $('#userBox').innerHTML = userBoxHTML(); bindUserBox(); }
go(VIEW_MODE ? 'price' : 'today');
</script>
